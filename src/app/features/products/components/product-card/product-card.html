<article
  class="group flex h-full flex-col rounded-3xl border border-border bg-surface p-3 shadow-sm transition-[transform,border-color,box-shadow] duration-300 ease-out hover:-translate-y-1.5 hover:border-primary hover:shadow-xl focus-within:border-primary focus-within:shadow-lg motion-reduce:transform-none"
>
  <!-- Product image -->
  <div
    class="relative flex aspect-[1.12] items-center justify-center overflow-hidden rounded-2xl bg-background p-5"
  >
    @if (product().badge; as badge) {
      <span
        class="absolute inset-s-3 top-3 z-10 rounded-full bg-primary px-3 py-1 text-xs font-semibold text-primary-foreground"
      >
        {{ badge }}
      </span>
    }

    <img
      [src]="product().image"
      [alt]="product().name"
      loading="lazy"
      class="h-full w-full object-contain transition-transform duration-300 group-hover:scale-105 motion-reduce:transform-none"
    />
  </div>

  <!-- Product content -->
  <div class="flex flex-1 flex-col px-1 pb-1 pt-5">
    <h3 class="text-lg font-bold leading-snug text-foreground">
      {{ product().name }}
    </h3>

    <p class="mt-2 text-sm leading-6 text-muted-foreground">
      {{ product().description }}
    </p>

    <!-- Actions -->
    <div class="mt-auto grid grid-cols-2 gap-2 pt-7">
      <app-ui-button variant="outline" [fullWidth]="true" (click)="onDetails()">
        {{ 'products.moreDetails' | transloco }}
      </app-ui-button>

      <app-ui-button variant="primary" [fullWidth]="true" (click)="onSelect()">
        {{ 'products.select' | transloco }}
      </app-ui-button>
    </div>
  </div>
</article>
