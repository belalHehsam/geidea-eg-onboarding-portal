<div class="flex flex-col gap-2">
  @if (label()) {
    <label [for]="inputId" class="text-sm font-medium text-foreground">
      {{ label() }}
    </label>
  }

  <div class="relative">
    @if (icon(); as leadingIcon) {
      <!-- leadingIcon : give me the real value instead write the icon() again  -->
      <lucide-icon
        [img]="leadingIcon"
        [size]="18"
        aria-hidden="true"
        class="pointer-events-none absolute inset-s-2 top-1/2 -translate-y-1/2 text-muted-foreground"
      />
    }

    <!-- [class.ps-12] : / if we have icon we increase the padding -->
    <input
      [id]="inputId"
      [type]="type() === 'password' && passwordVisible() ? 'text' : type()"
      [placeholder]="placeholder()"
      [autocomplete]="autocomplete()"
      [value]="value()"
      [disabled]="disabled()"
      [attr.aria-invalid]="error() ? true : null"
      [attr.aria-describedby]="error() ? errorId : null"
      (input)="onInput($event)"
      (blur)="onBlur()"
      [class.ps-10]="icon()"
      [class.pe-10]="type() === 'password' && showPasswordToggle()"
      [class.border-error]="!!error()"
      [class.border-border]="!error()"
      [class]="
        error()
          ? 'border-error focus:border-error focus:ring-error/20 w-full rounded-lg border bg-surface py-3 text-foreground outline-none transition-colors placeholder:text-muted-foreground  disabled:cursor-not-allowed disabled:opacity-50'
          : 'border-border focus:border-primary focus:ring-primary/20 w-full rounded-lg border bg-surface py-3 text-foreground outline-none transition-colors placeholder:text-muted-foreground  disabled:cursor-not-allowed disabled:opacity-50'
      "
    />

    @if (type() === 'password' && showPasswordToggle()) {
      <button
        type="button"
        [disabled]="disabled()"
        (click)="togglePasswordVisibility()"
        [attr.aria-label]="passwordVisible() ? hidePasswordLabel() : showPasswordLabel()"
        [attr.aria-pressed]="passwordVisible()"
        class="absolute inset-e-3 top-1/2 -translate-y-1/2 text-muted-foreground transition-colors hover:text-primary disabled:cursor-not-allowed"
      >
        <lucide-icon [img]="passwordVisible() ? EyeOff : Eye" [size]="18" aria-hidden="true" />
      </button>
    }

    <!-- Validation error -->
    @if (error()) {
      <p [id]="errorId" role="alert" class="text-xs text-error">
        {{ error() }}
      </p>
    }
  </div>
</div>
