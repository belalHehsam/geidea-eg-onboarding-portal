<div class="flex flex-col gap-2">
  @if (label()) {
    <label [for]="inputId" class="text-sm font-medium text-foreground">
      {{ label() }}
    </label>
  }

  <input
    [id]="inputId"
    [type]="type()"
    [placeholder]="placeholder()"
    [value]="value()"
    [disabled]="disabled()"
    (input)="onInput($event)"
    (blur)="onBlur()"
    class="w-full rounded-lg border border-border bg-surface px-4 py-3 text-foreground outline-none transition-colors placeholder:text-muted-foreground focus:border-primary focus:ring-2 focus:ring-primary/20 disabled:cursor-not-allowed disabled:opacity-50"
  />
</div>
