<div class="flex flex-col gap-2">
  @if (label()) {
    <label [for]="inputId" class="text-sm font-medium text-foreground">
      {{ label() }}
    </label>
  }

  <!-- Input container -->
  <div class="relative">
    <!-- Leading icon -->
    @if (icon(); as leadingIcon) {
      <span
        class="pointer-events-none absolute inset-y-0 start-3 flex items-center justify-center text-muted-foreground"
        aria-hidden="true"
      >
        <lucide-icon [img]="leadingIcon" [size]="18" />
      </span>
    }

    <!-- Native input -->
    <input
      [id]="inputId"
      [type]="type() === 'password' && passwordVisible() ? 'text' : type()"
      [placeholder]="placeholder()"
      [autocomplete]="autocomplete()"
      [value]="value()"
      [disabled]="disabled()"
      [attr.aria-invalid]="error() ? true : null"
      [attr.aria-describedby]="error() ? errorId : null"
      (input)="onInput($event)"
      (blur)="onBlur()"
      [class.ps-10]="!!icon()"
      [class.pe-10]="type() === 'password' && showPasswordToggle()"
      [class.border-error]="!!error()"
      [class.border-border]="!error()"
      class="block w-full rounded-lg border bg-surface px-4 py-3 text-foreground outline-none transition-colors placeholder:text-muted-foreground focus:border-primary focus:ring-2 focus:ring-primary/20 disabled:cursor-not-allowed disabled:opacity-50"
    />

    <!-- Password visibility toggle -->
    @if (type() === 'password' && showPasswordToggle()) {
      <button
        type="button"
        [disabled]="disabled()"
        (click)="togglePasswordVisibility()"
        [attr.aria-label]="passwordVisible() ? hidePasswordLabel() : showPasswordLabel()"
        [attr.aria-pressed]="passwordVisible()"
        class="absolute inset-y-0 end-3 flex items-center justify-center text-muted-foreground transition-colors hover:text-primary disabled:cursor-not-allowed"
      >
        <lucide-icon [img]="passwordVisible() ? EyeOff : Eye" [size]="18" aria-hidden="true" />
      </button>
    }
  </div>

  <!-- Error message -->
  @if (error()) {
    <p [id]="errorId" role="alert" class="text-xs text-error">
      {{ error() }}
    </p>
  }
</div>
